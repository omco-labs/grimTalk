[project]
name = "grimtalk"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
compress = [
    "anthropic>=0.40.0",
    "tiktoken>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
